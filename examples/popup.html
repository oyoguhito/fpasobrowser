<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fpasobrowser popup tab</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10141c; color: #f5f7fb; }
    body { margin: 0; display: grid; min-height: 100vh; place-items: center; padding: 32px; box-sizing: border-box; }
    main { max-width: 640px; padding: 36px; border: 2px solid #8fffc1; border-radius: 20px; background: #1c2433; box-shadow: 0 18px 44px #0009; }
    h1 { margin-top: 0; color: #8fffc1; }
    a { display: inline-block; padding: 12px 18px; border-radius: 999px; background: #ffcc33; color: #1a1a1a; font-weight: 800; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Popup terminal tab</h1>
    <p>This page was opened through <code>target=&quot;_blank&quot;</code> and is rendered as a new fpasobrowser terminal tab.</p>
    <p>Use <code>{</code> / <code>}</code> to switch tabs and <code>x</code> to close this tab.</p>
    <a href="interaction.html">Return in this tab</a>
  </main>
</body>
</html>
